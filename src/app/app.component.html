<ion-menu side="start" contentId="main-content">
  <ion-content>
    <ion-list>
      @if (nodes$ | async; as nodes) {
        @for (node of nodes; track node.ID_valve) {
          <ion-item>
            <ion-label>
              <h2>POSTE {{ node.ID_valve }}</h2>
              <p>{{ node.name_valve }}</p>
            </ion-label>
            <ion-toggle
              slot="end"
              [checked]="isNodeVisible(node.ID_valve)"
              [attr.aria-label]="'Exibir POSTE ' + node.ID_valve"
              (ionChange)="setNodeVisible(node.ID_valve, $event.detail.checked)">
            </ion-toggle>
          </ion-item>
        } @empty {
          <ion-item>
            <ion-label>Nenhum node encontrado.</ion-label>
          </ion-item>
        }
      }
    </ion-list>
    <div class="ion-padding">Versão 1.1.0</div>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar class="meu-header-personalizado">
      <ion-buttons slot="start" style="margin-left: 15px;">
        <img src="assets/SamasLogo2.png" style="width: 30px;">
      </ion-buttons>

      
      <ion-title style="text-align: center;">
        <span style="display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;">
          SAMAS
        </span>
      </ion-title>
      
      <ion-buttons slot="end">
        <ion-menu-toggle auto-hide="false">
          <ion-button fill="clear" aria-label="Abrir menu">
            <ion-icon slot="icon-only" [icon]="menuIcon"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
