<ion-menu side="start" contentId="main-content">

  <ion-content class="ion-padding">This is the menu content.</ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar class="meu-header-personalizado">
      <ion-buttons slot="start" style="margin-left: 15px;">
        <img src="assets/SamasLogo2.png" style="width: 30px;">
      </ion-buttons>

      
      <ion-title style="text-align: center;">
        <span style="display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;">
          SAMAS
        </span>
      </ion-title>
      
      <ion-buttons slot="end">
        <ion-menu-toggle auto-hide="false">
          <ion-button fill="clear" aria-label="Abrir menu">
            <ion-icon slot="icon-only" [icon]="menuIcon"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding" 
  style="background-color: red;
  display: flex; justify-content: center; align-items: center;"> 
    <div style="display: flex; justify-content: center; align-items: center;">
      
      
    </div>
  </ion-content>
</div>
